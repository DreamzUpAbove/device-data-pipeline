[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "device_data_pipeline"
version = "0.1.0"
description = "A robust Python module for saving scientific measurement data and metadata."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
